<style>
:root{
  --bg:#0f1216; --card:#1b1f27; --fg:#e6e8eb; --muted:#9aa3ad;
  --green:#4ade80; --amber:#fbbf24; --blue:#60a5fa; --red:#f87171; --teal:#2dd4bf;
  --border:#2a2f3a;
}
html,body{background:var(--bg);color:var(--fg);}
body{max-width:62rem;margin:2rem auto;padding:0 1.25rem;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;}
h1,h2,h3{line-height:1.25;font-weight:700;}
h1{font-size:1.9rem;border-bottom:2px solid var(--border);padding-bottom:.4rem;}
h2{font-size:1.4rem;margin-top:2rem;border-bottom:1px solid var(--border);padding-bottom:.3rem;}
h3{font-size:1.1rem;margin-top:1.5rem;color:var(--muted);}
a{color:var(--blue);}
hr{border:none;border-top:1px solid var(--border);margin:2rem 0;}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
pre{background:#0b0e12;border:1px solid var(--border);border-radius:6px;padding:1rem;overflow:auto;font-size:.85rem;}
code{background:#0b0e12;padding:.1rem .35rem;border-radius:3px;font-size:.85rem;}
pre code{background:none;padding:0;}
table{border-collapse:collapse;width:100%;margin:1rem 0;font-size:.92rem;}
th,td{border:1px solid var(--border);padding:.5rem .7rem;text-align:left;vertical-align:top;}
th{background:#161a21;}
.callout { background: var(--card); border-left: 4px solid var(--amber); padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 6px 6px 0; }
.callout-red { border-left-color: var(--red); }
.callout-green { border-left-color: var(--green); }
.callout-blue { border-left-color: var(--blue); }
.callout-teal { border-left-color: var(--teal); }
.callout strong:first-child { display: block; margin-bottom: 0.3rem; }
.callout p{margin:.4rem 0;}
.tag { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 3px; font-size: 0.8rem; font-weight: 600; margin-right: 0.3rem; }
.tag-physics { background: #1a3a2a; color: var(--green); }
.tag-decision { background: #3a2a1a; color: var(--amber); }
.tag-tradeoff { background: #1a2a3a; color: var(--blue); }
.tag-risk { background: #3a1a1a; color: var(--red); }
.pending { background: #2a2420; border-left: 4px solid var(--amber); padding: 0.6rem 1rem; margin: 0.8rem 0; border-radius: 0 6px 6px 0; font-style: italic; color:var(--muted); }
</style>
